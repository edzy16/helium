name: Build Helium (Manual Only - Experimental)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "I understand this takes 6+ hours and 200GB" to confirm'
        required: true

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
    - name: Warning
      run: |
        echo "⚠️  WARNING: This workflow is experimental and resource-intensive"
        echo "⚠️  It requires:"
        echo "   - 200+ GB disk space"
        echo "   - 6+ hours build time"
        echo "   - Will likely fail on GitHub Actions free tier"
        echo ""
        echo "✅ For production builds, submit a PR to:"
        echo "   https://github.com/imputnet/helium-windows"
        echo ""
        echo "This workflow is for testing purposes only."
        
        if [ "${{ github.event.inputs.confirm }}" != "I understand this takes 6+ hours and 200GB" ]; then
          echo "❌ Confirmation text doesn't match"
          echo "Please type exactly: I understand this takes 6+ hours and 200GB"
          exit 1
        fi
        
        echo "✅ Confirmation received. Proceeding with experimental build..."
  
  build-windows:
    needs: warn
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Chocolatey
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
    - name: Install Visual Studio Build Tools
      run: |
        choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.Windows10SDK.19041" -y
        
    - name: Install Git
      run: |
        choco install git -y
        
    - name: Set up depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$env:GITHUB_WORKSPACE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    - name: Set environment variables
      run: |
        echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
        echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
        
    - name: Clone Helium Windows platform
      run: |
        git clone https://github.com/imputnet/helium-windows.git
        cd helium-windows
        
        # Copy our patches to the platform repo
        xcopy /E /I /Y ..\patches .\core\patches
        
        # Update the series file
        copy ..\patches\series .\core\patches\series
        
    - name: Fetch Chromium source
      run: |
        cd helium-windows
        python scripts/fetch.py
        
    - name: Configure build
      run: |
        cd helium-windows
        python scripts/configure.py --release
        
    - name: Build Helium
      run: |
        cd helium-windows
        python scripts/build.py --release
      timeout-minutes: 240 # 4 hours max
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: helium-build-${{ github.sha }}
        path: helium-windows/out/Release/helium.exe
        retention-days: 7
        
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: immersive-mode-${{ github.sha }}
        name: Helium with Immersive Mode (Experimental)
        body: |
          ⚠️ **EXPERIMENTAL BUILD** ⚠️
          
          This is an experimental build with immersive mode feature enabled.
          
          **To test:**
          1. Download and extract helium.exe
          2. Run with: `helium.exe --enable-immersive-mode`
          3. Or enable in chrome://flags
          
          **Note:** This build was created using GitHub Actions and may have issues.
          For production builds, use the official Helium releases.
        files: helium-windows/out/Release/helium.exe
        draft: false
        prerelease: true